<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carnet Champi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ea;color:#222}
  header{background:#5b3a1e;color:#fff;padding:12px 16px;font-size:1.2em}
  nav{display:flex;position:sticky;top:0;background:#8a5a2b;z-index:1000}
  nav button{flex:1;padding:12px;border:0;background:none;color:#fff;font-size:1em}
  nav button:active{background:#5b3a1e}
  section{padding:12px}
  label{display:block;margin-top:10px;font-weight:600}
  input,textarea,button.act{width:100%;box-sizing:border-box;padding:10px;font-size:1em;margin-top:4px;border:1px solid #bbb;border-radius:8px}
  button.act{background:#5b3a1e;color:#fff;border:0;margin-top:12px}
  button.sec{background:#999}
  #preview{max-width:100%;border-radius:8px;margin-top:8px}
  .card{background:#fff;border-radius:10px;padding:10px;margin-bottom:10px;display:flex;gap:10px}
  .card img{width:80px;height:80px;object-fit:cover;border-radius:8px}
  .card small{color:#666;display:block}
  .card button{margin-right:6px;padding:4px 8px;font-size:.9em}
  #map{height:70vh;border-radius:8px}
  #gpsInfo{font-size:.9em;color:#555;margin-top:4px}
</style>
</head>
<body>
<header>🍄 Carnet Champi</header>
<nav>
  <button onclick="show('add')">➕ Trouvaille</button>
  <button onclick="show('list')">📖 Journal</button>
  <button onclick="show('mapTab')">🗺️ Carte</button>
</nav>

<section id="add">
  <label>Photo</label>
  <button class="act sec" onclick="document.getElementById('photoCam').click()">📷 Prendre une photo</button>
  <button class="act sec" onclick="document.getElementById('photoFile').click()">🖼️ Choisir dans mes fichiers</button>
  <input type="file" id="photoCam" accept="image/*" capture="environment" hidden>
  <input type="file" id="photoFile" accept="image/*" hidden>
  <img id="preview" hidden alt="">
  <button class="act sec" onclick="getGPS()">📍 Obtenir ma position GPS</button>
  <div id="gpsInfo">Position non relevée</div>

  <label>Espèce</label>
  <input id="species" list="speciesList" placeholder="Nom (ou « à déterminer »)">
  <datalist id="speciesList">
    <option value="Morille (Morchella)">
    <option value="Cèpe de Bordeaux (Boletus edulis)">
    <option value="Girolle (Cantharellus cibarius)">
    <option value="Trompette de la mort (Craterellus cornucopioides)">
    <option value="Oronge (Amanita caesarea)">
    <option value="Coulemelle (Macrolepiota procera)">
    <option value="Pied de mouton (Hydnum repandum)">
    <option value="Faux mousseron (Marasmius oreades)">
    <option value="Amanite tue-mouches (Amanita muscaria)">
    <option value="Tricholome équestre (Tricholoma equestre)">
  </datalist>

  <label>Substrat / arbres / sol</label>
  <input id="habitat" placeholder="ex : sous chênes, sol calcaire">
  <label>Notes</label>
  <textarea id="notes" rows="3" placeholder="Quantité, odeur, état, doutes…"></textarea>
  <button class="act" onclick="saveFind()">💾 Enregistrer</button>
</section>

<section id="list" hidden>
  <input id="search" placeholder="🔍 Rechercher (espèce, lieu, notes…)" oninput="renderList()">
  <button class="act sec" onclick="renderList(true)">📍 À proximité (500 m)</button>
  <button class="act sec" onclick="exportCSV()">⬇️ Exporter en CSV</button>
  <div id="items" style="margin-top:12px"></div>
</section>

<section id="mapTab" hidden>
  <div id="map"></div>
  <p id="mapMsg"></p>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var db, photoBlob = null, photoDate = null, pos = null, map = null, layer = null;

// ---------- Base de données locale ----------
var req = indexedDB.open('carnet-champi', 1);
req.onupgradeneeded = function(e){ e.target.result.createObjectStore('finds', {keyPath:'id', autoIncrement:true}); };
req.onsuccess = function(e){ db = e.target.result; renderList(); };
req.onerror = function(){ alert('Base de données locale indisponible.'); };
function store(m){ return db.transaction('finds', m).objectStore('finds'); }
function all(){ return new Promise(function(r){ var q = store('readonly').getAll(); q.onsuccess = function(){ r(q.result); }; }); }
function add(o){ return new Promise(function(r){ var q = store('readwrite').add(o); q.onsuccess = function(){ r(); }; }); }
function del(id){ return new Promise(function(r){ var q = store('readwrite').delete(id); q.onsuccess = function(){ r(); }; }); }
function $(id){ return document.getElementById(id); }

// ---------- Lecture EXIF (GPS + date) ----------
async function readExif(file){
  try {
    var buf = await file.slice(0, 262144).arrayBuffer();
    var v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return null;
    var off = 2;
    while (off + 4 < v.byteLength) {
      var marker = v.getUint16(off);
      if (marker === 0xFFDA || (marker & 0xFF00) !== 0xFF00) break;
      var len = v.getUint16(off + 2);
      if (marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) return parseTiff(v, off + 10);
      off += 2 + len;
    }
  } catch(e) {}
  return null;
}
function parseTiff(v, t){
  var le = v.getUint16(t) === 0x4949;
  var u16 = function(o){ return v.getUint16(o, le); };
  var u32 = function(o){ return v.getUint32(o, le); };
  if (u16(t + 2) !== 42) return null;
  function findTag(ifd, tag){
    var n = u16(ifd);
    for (var i = 0; i < n; i++) { var e = ifd + 2 + i * 12; if (u16(e) === tag) return e; }
    return null;
  }
  function rats(e, n){
    var o = t + u32(e + 8), r = [];
    for (var i = 0; i < n; i++) r.push(u32(o + i * 8) / (u32(o + i * 8 + 4) || 1));
    return r;
  }
  var out = {};
  var ifd0 = t + u32(t + 4);
  var exifPtr = findTag(ifd0, 0x8769);
  if (exifPtr) {
    var d = findTag(t + u32(exifPtr + 8), 0x9003);
    if (d) {
      var s = '';
      for (var i = 0; i < 19; i++) s += String.fromCharCode(v.getUint8(t + u32(d + 8) + i));
      var m = s.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})$/);
      if (m) out.date = new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]).toISOString();
    }
  }
  var gpsPtr = findTag(ifd0, 0x8825);
  if (gpsPtr) {
    var g = t + u32(gpsPtr + 8);
    var latE = findTag(g, 2), lonE = findTag(g, 4);
    if (latE && lonE) {
      var toDeg = function(a){ return a[0] + a[1] / 60 + a[2] / 3600; };
      var lat = toDeg(rats(latE, 3)), lon = toDeg(rats(lonE, 3));
      var latRef = findTag(g, 1), lonRef = findTag(g, 3);
      if (latRef && String.fromCharCode(v.getUint8(latRef + 8)) === 'S') lat = -lat;
      if (lonRef && String.fromCharCode(v.getUint8(lonRef + 8)) === 'W') lon = -lon;
      if (isFinite(lat) && isFinite(lon) && (lat || lon)) {
        out.pos = { lat: lat, lon: lon, alt: null, acc: null };
        var altE = findTag(g, 6);
        if (altE) {
          var alt = rats(altE, 1)[0];
          var altRef = findTag(g, 5);
          if (altRef && v.getUint8(altRef + 8) === 1) alt = -alt;
          out.pos.alt = alt;
        }
      }
    }
  }
  return out;
}

// ---------- Navigation ----------
function show(id){
  document.querySelectorAll('section').forEach(function(s){ s.hidden = s.id !== id; });
  if (id === 'list') renderList();
  if (id === 'mapTab') initMap();
}

// ---------- Photo ----------
function handlePhoto(e, source){
  var f = e.target.files[0]; if (!f) return;
  photoDate = null;
  var url = URL.createObjectURL(f);
  var img = new Image();
  img.onload = function(){
    var s = Math.min(1, 1280 / Math.max(img.width, img.height));
    var c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(function(b){
      photoBlob = b;
      var p = $('preview');
      p.src = URL.createObjectURL(b); p.hidden = false;
    }, 'image/jpeg', 0.85);
    URL.revokeObjectURL(url);
  };
  img.onerror = function(){ alert('Cette image ne peut pas être lue par le navigateur (format HEIC ?).'); };
  img.src = url;

  var info = $('gpsInfo');
  if (source === 'camera') {
    getGPS();
  } else {
    pos = null;
    info.textContent = 'Lecture du GPS de la photo…';
    readExif(f).then(function(exif){
      if (exif && exif.date) photoDate = exif.date;
      if (exif && exif.pos) {
        pos = exif.pos;
        info.textContent = '✅ GPS trouvé dans la photo : ' + pos.lat.toFixed(5) + ', ' + pos.lon.toFixed(5) +
          (pos.alt != null ? ' — alt. ' + Math.round(pos.alt) + ' m' : '');
      } else {
        info.textContent = '📷 Cette photo n’a pas de GPS (Android le retire parfois). Utilise le bouton ci-dessus si tu es sur place, ou laisse vide.';
      }
    });
  }
}
$('photoCam').addEventListener('change', function(e){ handlePhoto(e, 'camera'); });
$('photoFile').addEventListener('change', function(e){ handlePhoto(e, 'file'); });

// ---------- GPS ----------
function getPos(){
  return new Promise(function(res, rej){
    if (!navigator.geolocation) return rej(new Error('GPS indisponible'));
    navigator.geolocation.getCurrentPosition(
      function(p){ res({lat:p.coords.latitude, lon:p.coords.longitude, alt:p.coords.altitude, acc:p.coords.accuracy}); },
      function(err){ rej(err); }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
  });
}
async function getGPS(){
  var info = $('gpsInfo');
  info.textContent = 'Recherche de la position…';
  try {
    pos = await getPos();
    info.textContent = '✅ ' + pos.lat.toFixed(5) + ', ' + pos.lon.toFixed(5) +
      (pos.alt != null ? ' — alt. ' + Math.round(pos.alt) + ' m' : '') + ' (±' + Math.round(pos.acc) + ' m)';
  } catch(e) {
    info.textContent = '❌ Position impossible (HTTPS requis + autorisation de localisation).';
  }
}

// ---------- Enregistrement ----------
async function saveFind(){
  if (!photoBlob && !$('species').value.trim()) {
    return alert('Ajoute au moins une photo ou un nom d’espèce.');
  }
  await add({
    date: photoDate || new Date().toISOString(),
    species: $('species').value.trim() || 'À déterminer',
    habitat: $('habitat').value.trim(),
    notes: $('notes').value.trim(),
    photo: photoBlob, pos: pos
  });
  ['species','habitat','notes'].forEach(function(i){ $(i).value = ''; });
  $('photoCam').value = '';
  $('photoFile').value = '';
  $('preview').hidden = true;
  photoBlob = null; photoDate = null; pos = null;
  $('gpsInfo').textContent = 'Position non relevée';
  alert('Trouvaille enregistrée ✅');
}

// ---------- Journal ----------
function dist(a, b){
  var R = 6371000, r = function(x){ return x * Math.PI / 180; };
  var dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
  var h = Math.pow(Math.sin(dLat/2), 2) + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.pow(Math.sin(dLon/2), 2);
  return 2 * R * Math.asin(Math.sqrt(h));
}
function line(parent, txt){ var s = document.createElement('small'); s.textContent = txt; parent.appendChild(s); }

async function renderList(nearby){
  if (!db) return;
  var finds = (await all()).sort(function(a, b){ return b.date.localeCompare(a.date); });
  var q = $('search').value.toLowerCase();
  if (q) finds = finds.filter(function(f){ return (f.species + ' ' + f.habitat + ' ' + f.notes).toLowerCase().indexOf(q) !== -1; });
  if (nearby === true) {
    try {
      var me = await getPos();
      finds = finds.filter(function(f){ return f.pos && dist(me, f.pos) <= 500; });
    } catch(e) { alert('Position indisponible.'); }
  }
  var box = $('items');
  box.innerHTML = finds.length ? '' : '<p>Aucune trouvaille.</p>';
  finds.forEach(function(f){
    var d = document.createElement('div'); d.className = 'card';
    if (f.photo) { var i = document.createElement('img'); i.src = URL.createObjectURL(f.photo); d.appendChild(i); }
    var t = document.createElement('div');
    var b = document.createElement('b'); b.textContent = f.species; t.appendChild(b);
    line(t, new Date(f.date).toLocaleString('fr-FR'));
    if (f.habitat) line(t, '🌲 ' + f.habitat);
    if (f.notes) line(t, '📝 ' + f.notes);
    if (f.pos) {
      line(t, '📍 ' + f.pos.lat.toFixed(5) + ', ' + f.pos.lon.toFixed(5));
      var m = document.createElement('button'); m.textContent = '🗺️ Voir';
      m.onclick = function(){ show('mapTab'); setTimeout(function(){ if (map) map.setView([f.pos.lat, f.pos.lon], 17); }, 400); };
      t.appendChild(m);
    }
    var x = document.createElement('button'); x.textContent = '🗑️';
    x.onclick = async function(){ if (confirm('Supprimer cette trouvaille ?')) { await del(f.id); renderList(); } };
    t.appendChild(x);
    d.appendChild(t); box.appendChild(d);
  });
}

// ---------- Carte ----------
async function initMap(){
  var msg = $('mapMsg');
  if (typeof L === 'undefined') { msg.textContent = 'Carte indisponible : la bibliothèque Leaflet n’a pas pu être chargée (pas de connexion ?).'; return; }
  if (!map) {
    map = L.map('map').setView([46.6, 2.5], 6);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  setTimeout(function(){ map.invalidateSize(); }, 100);
  layer.clearLayers();
  var pts = [];
  (await all()).forEach(function(f){
    if (!f.pos) return;
    pts.push([f.pos.lat, f.pos.lon]);
    var pop = document.createElement('div');
    var bb = document.createElement('b'); bb.textContent = f.species; pop.appendChild(bb);
    pop.appendChild(document.createElement('br'));
    pop.appendChild(document.createTextNode(new Date(f.date).toLocaleDateString('fr-FR')));
    L.marker([f.pos.lat, f.pos.lon]).addTo(layer).bindPopup(pop);
  });
  if (pts.length) map.fitBounds(pts, {padding:[30,30], maxZoom:16});
  msg.textContent = pts.length + ' trouvaille(s) géolocalisée(s).';
}

// ---------- Export CSV ----------
async function exportCSV(){
  var rows = [['date','espece','habitat','notes','lat','lon','alt']];
  (await all()).forEach(function(f){
    rows.push([f.date, f.species, f.habitat, f.notes,
      f.pos ? f.pos.lat : '', f.pos ? f.pos.lon : '', (f.pos && f.pos.alt != null) ? f.pos.alt : '']);
  });
  var csv = rows.map(function(r){ return r.map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], {type:'text/csv'}));
  a.download = 'carnet-champi.csv'; a.click();
}
</script>
</body>
</html>
